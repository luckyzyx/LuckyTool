hikage-widget-androidx = { group = "com.highcapable.hikage", name = "hikage-widget-androidx", version = "1.0.2" }
hikage-widget-material = { group = "com.highcapable.hikage", name = "hikage-widget-material", version = "1.0.2" }

material = { group = "com.google.android.material", name = "material", version = "1.14.0" }
