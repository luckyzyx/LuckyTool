[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"

kavaref = "1.1.0"
betterandroid = "1.1.6"
navigation = "2.10.2"
kotlinx-coroutines = "1.11.0"
kotlinx-serialization = "1.11.0"
libsu = "6.0.0"
glide = "5.0.9"
markwon = "4.6.2"
lsparanoid = "0.6.0"
yukihook = "1.5.0-beta.8"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

navigation-safe-args = { id = "androidx.navigation.safeargs.kotlin" }

lsplugin-resopt = { id = "org.lsposed.lsplugin.resopt", version = "1.6" }
lsplugin-lsparanoid = { id = "org.lsposed.lsparanoid", version.ref = "lsparanoid" }

[libraries]
xposed-api = { group = "de.robv.android.xposed", name = "api", version = "82" }
libxposed-api = { group = "io.github.libxposed", name = "api", version = "102.0.0" }
libxposed-service = { group = "io.github.libxposed", name = "service", version = "102.0.0" }

yukihook-bom = { group = "com.highcapable.yukihookapi", name = "yukihook-bom", version.ref = "yukihook" }
